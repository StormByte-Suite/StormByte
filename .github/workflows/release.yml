name: Release

# Manual only. Run it from the Actions tab after the GitHub release is
# published. Drafts and prereleases are not "latest". Assets with the same
# name are replaced, so a retag can be rebuilt.
#
# Same jobs as ci.yml, without the doc deploy. Each build also installs and
# zips the prefix. One job then attaches those zips to the latest release.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ###########################################################################
  # Bootstraps (warm shared caches; other jobs still check out on their runner)
  # Submodule cache is OS-scoped by Actions — one warm job per OS.
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm submodule / checkout cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

  apt-bootstrap:
    runs-on: ubuntu-latest
    name: apt-bootstrap
    steps:
      - name: Warm APT lists cache
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Read the latest published release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq .tagName)"
          if [ -z "$tag" ]; then
            echo "::error::No published release. Publish it, then run this workflow."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${tag}"

  ###########################################################################
  # Linux
  # clang is libstdc++ (same ABI as gcc). clang-libc++ is the other one.
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap, resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            stdlib: libstdc++
            asset: linux-x64-libstdc++
          - compiler: clang-libc++
            stdlib: libc++
            asset: linux-x64-libc++
    name: linux-${{ matrix.stdlib }}
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib:${{ github.workspace }}/build/thirdparty/buildmaster/install/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-release-${{ matrix.compiler }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=ON
            -DCMAKE_CXX_FLAGS=-stdlib=${{ matrix.stdlib }}
          run-tests: false
          install: true
          install-location: package

      - name: Zip the install prefix
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          name="${{ github.event.repository.name }}-${{ needs.resolve.outputs.tag }}-${{ matrix.asset }}.zip"
          (
            cd package
            cmake -E tar cf "../${name}" --format=zip -- .
          )
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Packed ${name}"
          cmake -E tar tf "${name}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error

  ###########################################################################
  # macOS (Apple Clang for "clang"; no apt bootstrap)
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap, resolve]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    name: macos-${{ matrix.compiler }}
    env:
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/lib:${{ github.workspace }}/build/thirdparty/buildmaster/install/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-release-${{ matrix.compiler }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=ON
          run-tests: false
          install: true
          install-location: package

      - name: Zip the install prefix
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ matrix.compiler }}" != "clang" ]; then
            suffix="-${{ matrix.compiler }}"
          fi
          name="${{ github.event.repository.name }}-${{ needs.resolve.outputs.tag }}-macos-arm64${suffix}.zip"
          (
            cd package
            cmake -E tar cf "../${name}" --format=zip -- .
          )
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Packed ${name}"
          cmake -E tar tf "${name}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error

  ###########################################################################
  # Windows
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap, resolve]
    runs-on: windows-latest
    name: windows-clang-cl

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: clang-cl
          ccache-key: v1-release-clang-cl
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=ON
          run-tests: false
          install: true
          install-location: package

      - name: Zip the install prefix
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          name="${{ github.event.repository.name }}-${{ needs.resolve.outputs.tag }}-windows-x64.zip"
          (
            cd package
            cmake -E tar cf "../${name}" --format=zip -- .
          )
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Packed ${name}"
          cmake -E tar tf "${name}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error

  ###########################################################################
  # Attach the archives to the latest published release
  ###########################################################################
  publish:
    needs: [resolve, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach archives to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          shopt -s nullglob
          files=(dist/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No archives to upload"
            exit 1
          fi
          printf 'Uploading to %s:\n' "$tag"
          printf '  %s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --clobber
